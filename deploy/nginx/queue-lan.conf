# ─────────────────────────────────────────────────────────────────────────
#  Вариант для локальной сети: без домена и HTTPS.
#  Студенты заходят по адресу сервера — http://192.168.1.50/
#  /etc/nginx/conf.d/queue-lan.conf
#
#  COOKIE_SECURE в .env при этом должен остаться выключенным,
#  иначе браузер не отправит куку по http и вход в админку не заработает.
# ─────────────────────────────────────────────────────────────────────────

upstream au_queue {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/au-queue.access.log;
    error_log  /var/log/nginx/au-queue.error.log;

    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;

    gzip            on;
    gzip_min_length 512;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    proxy_redirect     off;

    # Без add_header внутри location: он бы отменил наследование
    # заголовков безопасности с уровня server.
    location ~* ^/static/(fonts|img)/ {
        proxy_pass http://au_queue;
        expires 30d;
    }

    location /static/ {
        proxy_pass http://au_queue;
        expires 1h;
    }

    # Список очереди телефоны тянут постоянно — в лог это писать незачем.
    location = /api/queue {
        access_log off;
        proxy_pass http://au_queue;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://au_queue;
    }

    location / {
        proxy_pass http://au_queue;
    }
}
