# ─────────────────────────────────────────────────────────────────────────
#  Запись на приём — публикация через существующий nginx
#  /etc/nginx/conf.d/queue.uralolimp.website.conf
#
#  Сервис слушает 127.0.0.1:8080 (BIND_ADDR/BIND_PORT в .env) и наружу
#  сам по себе не торчит — доступ только через этот конфиг.
#
#  Поменяйте queue.uralolimp.website на своё имя и перечитайте конфиг:
#      nginx -t && systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────

# ВНИМАНИЕ про лимиты. Ключ $binary_remote_addr — это внешний адрес.
# Если корпус выходит в интернет через один NAT, вся группа придёт с одного
# адреса, и жёсткий лимит отрежет половину студентов на ровном месте.
# Значения ниже рассчитаны на такой случай: они ловят скрипт, но не поток.
# Проверить, что сработал именно лимит, а не приложение: 503 в access-логе
# и строка "limiting requests" в error-логе.
limit_req_zone $binary_remote_addr zone=au_queue_form:10m  rate=120r/m;
limit_req_zone $binary_remote_addr zone=au_queue_login:10m rate=20r/m;

upstream au_queue {
    server 127.0.0.1:8080;
    keepalive 16;
}

# ── HTTP: только ACME и редирект на HTTPS ────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name queue.uralolimp.website;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name queue.uralolimp.website;

    # certbot --nginx -d queue.uralolimp.website пропишет эти пути сам
    ssl_certificate     /etc/letsencrypt/live/queue.uralolimp.website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/queue.uralolimp.website/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/au-queue.access.log;
    error_log  /var/log/nginx/au-queue.error.log;

    # Загрузок в сервисе нет, приходят только формы — потолок можно занизить
    client_max_body_size 64k;
    client_body_timeout  15s;

    # ── Заголовки безопасности ──────────────────────────────────────────
    # script-src без 'unsafe-inline': инлайновых скриптов в шаблонах нет,
    # тема подключается файлом /static/js/theme.js. 'unsafe-inline' остаётся
    # только у стилей — в разметке используются атрибуты style=.
    add_header X-Content-Type-Options    "nosniff"                        always;
    add_header X-Frame-Options           "SAMEORIGIN"                     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000"               always;
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    gzip              on;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types        text/css application/javascript application/json image/svg+xml;

    # ── Общие параметры проксирования ───────────────────────────────────
    # X-Forwarded-For нужен приложению: по нему считается отпечаток адреса
    # для защиты от флуда. Без него все брони будут выглядеть как с 127.0.0.1.
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    proxy_redirect     off;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    # ── Статика ─────────────────────────────────────────────────────────
    # Здесь намеренно только expires и ни одного add_header: как только в
    # location появляется свой add_header, nginx перестаёт наследовать все
    # заголовки с уровня server — и статика осталась бы без nosniff и CSP.
    # expires наследование не ломает и сам выставляет Cache-Control.

    # Шрифты и логотип не меняются — кэшируем надолго.
    location ~* ^/static/(fonts|img)/ {
        proxy_pass http://au_queue;
        expires 30d;
    }

    # CSS и JS живут час: правку стилей студенты увидят в тот же день,
    # а не «после того, как почистят кэш».
    location /static/ {
        proxy_pass http://au_queue;
        expires 1h;
    }

    # ── Формы: бронь и проверка капчи ───────────────────────────────────
    location /book/ {
        limit_req zone=au_queue_form burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://au_queue;
    }

    location /api/captcha {
        limit_req zone=au_queue_form burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://au_queue;
    }

    # ── Вход в админку: подбор пароля тут не нужен ──────────────────────
    location = /admin/login {
        limit_req zone=au_queue_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://au_queue;

        # Дополнительно можно пустить только со своих адресов.
        # Раскомментируйте и подставьте сеть колледжа:
        # allow 192.168.0.0/16;
        # allow 203.0.113.7;
        # deny  all;
    }

    # ── Проверка живости — наружу не отдаём ─────────────────────────────
    location = /healthz {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        proxy_pass http://au_queue;
    }

    location / {
        proxy_pass http://au_queue;
    }
}
