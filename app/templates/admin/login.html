{% extends "base.html" %}
{% block title %}Вход в панель{% endblock %}

{% block content %}
<div style="max-width:420px;margin:0 auto">
  <h1>Панель приёма</h1>
  <p class="muted">Доступ только для {{ teacher_name }}.</p>

  {% if error %}
  <div class="callout callout--err"><p style="margin:0">{{ error }}</p></div>
  {% endif %}

  <form method="post" action="/admin/login" class="card">
    <div class="field">
      <label class="field__label" for="username">Логин</label>
      <input class="input" type="text" id="username" name="username" autocomplete="username"
             autocapitalize="none" spellcheck="false" required autofocus>
    </div>
    <div class="field">
      <label class="field__label" for="password">Пароль</label>
      <input class="input" type="password" id="password" name="password"
             autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn--primary btn--block btn--lg">Войти</button>
  </form>
</div>
{% endblock %}
